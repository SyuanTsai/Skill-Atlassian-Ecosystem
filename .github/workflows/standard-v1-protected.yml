name: Standard v1 Protected Validation
# This workflow is base-owned for pull_request_target. Candidate files are
# checked out only as data; trusted supervisor files are materialized from
# github.sha, the event-bound base commit.

on:
  pull_request_target:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  repository-contract-windows-powershell:
    name: repository-contract (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize protected Windows compatibility contract
        shell: powershell
        env:
          TRUSTED_SUPERVISOR_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $trustedCommit = [string]$env:TRUSTED_SUPERVISOR_COMMIT
          if ($trustedCommit -notmatch '^[0-9a-f]{40}$') {
            throw 'The protected supervisor commit must be one lowercase full Git SHA.'
          }
          $trustedRoot = Join-Path $env:RUNNER_TEMP 'standard-v1-trusted-windows-contract'
          if (Test-Path -LiteralPath $trustedRoot) {
            throw "The protected Windows contract root already exists: $trustedRoot"
          }
          [void](New-Item -ItemType Directory -Path $trustedRoot -Force)
          $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $gitPath = [IO.Path]::GetFullPath([string]$gitCommand.Path)
          $relativePath = 'tests/validate-windows-powershell.ps1'
            $revision = "${trustedCommit}:$relativePath"
            $actualBlob = ((& $gitPath rev-parse $revision 2>$null) | Select-Object -First 1).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualBlob -notmatch '^[0-9a-f]{40}$') {
              throw 'The protected Windows contract is missing from the event-bound supervisor commit.'
            }
            $destination = Join-Path $trustedRoot (Split-Path -Leaf $relativePath)
            $process = [Diagnostics.Process]::new()
            $process.StartInfo.FileName = $gitPath
            $process.StartInfo.Arguments = "cat-file blob $revision"
            $process.StartInfo.UseShellExecute = $false
            $process.StartInfo.RedirectStandardOutput = $true
            $process.StartInfo.RedirectStandardError = $true
            $process.StartInfo.RedirectStandardInput = $true
            if (-not $process.Start()) { throw 'Could not start Git to materialize the protected Windows contract.' }
            $process.StandardInput.Close()
            $stream = [IO.File]::Open($destination, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::Read)
            try { $process.StandardOutput.BaseStream.CopyTo($stream) }
            finally { $stream.Dispose() }
            $stderr = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { throw "Git could not materialize the protected Windows contract: $stderr" }
            $item = Get-Item -LiteralPath $destination -Force
            if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'Protected Windows contract must be a regular non-reparse file.'
            }
          $rootItem = Get-Item -LiteralPath $trustedRoot -Force
          if (-not $rootItem.PSIsContainer -or ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'Protected Windows contract root must be a regular non-reparse directory.'
          }
          "TRUSTED_WINDOWS_CONTRACT=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate Windows PowerShell compatibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $windowsPowerShellPath = [IO.Path]::GetFullPath((Join-Path $PSHOME 'powershell.exe'))
          $windowsPowerShellItem = Get-Item -LiteralPath $windowsPowerShellPath -Force -ErrorAction Stop
          if ($windowsPowerShellItem.PSIsContainer -or
              ($windowsPowerShellItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'The protected Windows PowerShell executable must be a regular non-reparse file.'
          }
          $protectedContractArguments = @(
            '-NoLogo',
            '-NoProfile',
            '-NonInteractive',
            '-ExecutionPolicy', 'Bypass',
            '-File', $env:TRUSTED_WINDOWS_CONTRACT,
            '-RepositoryRoot', (Get-Location).Path
          )
          & $windowsPowerShellPath @protectedContractArguments
          $protectedContractExitCode = $LASTEXITCODE
          if ($protectedContractExitCode -ne 0) {
            throw 'The protected Windows PowerShell compatibility contract failed.'
          }

      - name: Parse candidate PowerShell trust-anchor files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $gitPath = [IO.Path]::GetFullPath([string]$gitCommand.Path)
          $trackedPsOutput = [string]((& $gitPath ls-files -z -- '*.ps1' '*.psm1') -join '')
          if ($LASTEXITCODE -ne 0) { throw 'Git failed while enumerating candidate PowerShell trust-anchor files.' }
          $trackedPsFiles = @($trackedPsOutput.Split([char]0) | Where-Object { -not [string]::IsNullOrEmpty([string]$_) })
          foreach ($relativePath in $trackedPsFiles) {
            if ([IO.Path]::IsPathRooted([string]$relativePath) -or
                [string]$relativePath -cmatch '(^|/)\.{1,2}(/|$)' -or
                [string]$relativePath -cmatch '[\x00\r\n]' -or
                ([string]$relativePath).Contains('\')) {
              throw "Candidate PowerShell path is unsafe: $relativePath"
            }
            $candidatePath = Join-Path (Get-Location).Path ([string]$relativePath)
            if (-not (Test-Path -LiteralPath $candidatePath -PathType Leaf)) {
              throw "Candidate PowerShell trust-anchor file is missing: $relativePath"
            }
            $candidateItem = Get-Item -LiteralPath $candidatePath -Force
            if (($candidateItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Candidate PowerShell trust-anchor file is a reparse point: $relativePath"
            }
            $tokens = $null
            $errors = $null
            $candidateBytes = [IO.File]::ReadAllBytes($candidatePath)
            $candidateOffset = if ($candidateBytes.Length -ge 3 -and
                $candidateBytes[0] -eq 0xEF -and
                $candidateBytes[1] -eq 0xBB -and
                $candidateBytes[2] -eq 0xBF) {
              3
            }
            else {
              0
            }
            $candidateSource = [Text.UTF8Encoding]::new($false, $true).GetString(
              $candidateBytes,
              $candidateOffset,
              $candidateBytes.Length - $candidateOffset
            )
            [Management.Automation.Language.Parser]::ParseInput(
              $candidateSource,
              $candidatePath,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if (@($errors).Count -gt 0) {
              throw "Candidate PowerShell file does not parse under Windows PowerShell 5.1: $relativePath"
            }
          }
          foreach ($requiredPath in @('scripts/Validate.ps1', 'scripts/Test-Repository.ps1')) {
            if ($trackedPsFiles -cnotcontains $requiredPath) {
              throw "Candidate trust-anchor file is not tracked: $requiredPath"
            }
          }



  canonical-validation:
    name: Atlassian Ecosystem Standard v1
    needs:
      - repository-contract-windows-powershell
    outputs:
      evidence_base64: ${{ steps.export-evidence.outputs.evidence_base64 }}
      evidence_sha256: ${{ steps.export-evidence.outputs.evidence_sha256 }}
      cgroup_cleanup: ${{ steps['cgroup-cleanup'].outcome }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize protected validation supervisor
        shell: pwsh
        env:
          TRUSTED_SUPERVISOR_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $trustedCommit = [string]$env:TRUSTED_SUPERVISOR_COMMIT
          if ($trustedCommit -notmatch '^[0-9a-f]{40}$') {
            throw 'The protected supervisor commit must be one lowercase full Git SHA.'
          }
          $trustedRoot = Join-Path $env:RUNNER_TEMP 'standard-v1-trusted-supervisor'
          if (Test-Path -LiteralPath $trustedRoot) {
            throw "The protected supervisor root already exists: $trustedRoot"
          }
          $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $gitPath = [IO.Path]::GetFullPath([string]$gitCommand.Path)
          $files = @(
            'config/standard-v1.json',
            'scripts/Validate.ps1',
            'scripts/Test-Repository.ps1',
            'tests/validate-repository.ps1',
            'tests/validate-repository-standalone.ps1',
            'tests/validate-api-access.ps1',
            'scripts/Invoke-StandardAuthorityGate.ps1',
            'scripts/Resolve-PythonWheelClosure.py',
            'scripts/Resolve-StandardValidationTool.ps1',
            'scripts/Invoke-StandardValidation.ps1',
            'scripts/Validate-UpstreamAdapter.ps1',
            'docs/standards/README.md',
            'docs/standards/managed-skill-lifecycle.md',
            'docs/standards/schemas/managed-skill-lifecycle-v1.schema.json',
            'docs/standards/schemas/openai-agent-metadata.schema.json',
            'docs/standards/schemas/source-inventory-v2.schema.json',
            'docs/standards/schemas/standard-semantic-consent-evidence-v2.schema.json',
            'docs/standards/schemas/validation-security-gate-v1.schema.json',
            'docs/standards/schemas/standard-validation-adapter-v1.schema.json',
            'docs/standards/schemas/standard-validation-evidence-v1.schema.json',
            'docs/standards/schemas/upstream-adapter-v1.schema.json',
            'docs/standards/skill-repository-review-matrix.md',
            'docs/standards/skill-repository-standard.md',
            'docs/standards/upstream-interoperability.md',
            'docs/standards/validation-security-gate.json',
            'docs/standards/validation-toolchain.json',
            'docs/standards/standard-validation-contract-v1.json',
            'docs/standards/trust-anchors/human-approval-public-key.xml',
            'docs/standards/trust-anchors/trusted-supervisor-public-key.xml',
            'docs/standards/upstream-adapter.json'
          )
          foreach ($relativePath in $files) {
            $revision = "${trustedCommit}:$relativePath"
            $actualBlob = ((& $gitPath rev-parse $revision 2>$null) | Select-Object -First 1).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualBlob -notmatch '^[0-9a-f]{40}$') {
              throw "The protected supervisor file '$relativePath' is missing from the event-bound supervisor commit."
            }
            $destination = Join-Path $trustedRoot ($relativePath.Replace('/', [IO.Path]::DirectorySeparatorChar))
            $destinationParent = Split-Path -Parent $destination
            [void](New-Item -ItemType Directory -Path $destinationParent -Force)
            $process = [Diagnostics.Process]::new()
            $process.StartInfo.FileName = $gitPath
            $process.StartInfo.UseShellExecute = $false
            $process.StartInfo.RedirectStandardOutput = $true
            $process.StartInfo.RedirectStandardError = $true
            $process.StartInfo.RedirectStandardInput = $true
            [void]$process.StartInfo.ArgumentList.Add('cat-file')
            [void]$process.StartInfo.ArgumentList.Add('blob')
            [void]$process.StartInfo.ArgumentList.Add($revision)
            if (-not $process.Start()) { throw "Could not start Git to materialize '$relativePath'." }
            $process.StandardInput.Close()
            $stream = [IO.File]::Open($destination, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::Read)
            try { $process.StandardOutput.BaseStream.CopyTo($stream) }
            finally { $stream.Dispose() }
            $stderr = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) {
              throw "Git could not materialize the protected supervisor '$relativePath': $stderr"
            }
            $item = Get-Item -LiteralPath $destination -Force
            if (-not $item.PSIsContainer -and ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Protected supervisor file '$relativePath' is a reparse point."
            }
          }
          $expectedAuthorityHashes = [ordered]@{
            'scripts/Invoke-StandardValidation.ps1' = 'c7078b18a8bea240be4710aa6c0080b22bda7756ee120bfa705ef83c3489dbd1'
            'docs/standards/standard-validation-contract-v1.json' = 'b68849e986153732c65b4b02a1431f22d2f985781fe5c6299d18d97cd188b57d'
            'docs/standards/schemas/standard-validation-evidence-v1.schema.json' = '5482b69c75613a8025be267b5f52b4c47839f8d5a268db9de27414dfd7303121'
          }
          foreach ($entry in $expectedAuthorityHashes.GetEnumerator()) {
            $materialized = Join-Path $trustedRoot ($entry.Key.Replace('/', [IO.Path]::DirectorySeparatorChar))
            $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $materialized).Hash.ToLowerInvariant()
            if ($actualSha256 -cne $entry.Value) {
              throw "Trusted authority file '$($entry.Key)' did not match the pinned PR54abdf snapshot."
            }
          }
          $trustedConfigPath = Join-Path $trustedRoot 'config/standard-v1.json'
          $trustedConfig = Get-Content -LiteralPath $trustedConfigPath -Raw | ConvertFrom-Json -Depth 20
          foreach ($entry in @($trustedConfig.authority.files)) {
            $authorityFilePath = Join-Path $trustedRoot ($entry.path.Replace('/', [IO.Path]::DirectorySeparatorChar))
            $authorityFileHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $authorityFilePath).Hash.ToLowerInvariant()
            if ($authorityFileHash -cne [string]$entry.sha256) {
              throw "Trusted authority file '$($entry.path)' did not match the immutable config inventory."
            }
          }
          $rootItem = Get-Item -LiteralPath $trustedRoot -Force
          if (-not $rootItem.PSIsContainer -or ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'Protected supervisor root must be a regular non-reparse directory.'
          }
          "TRUSTED_SUPERVISOR_ROOT=$trustedRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up approved Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Capture resolved stable Go runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionOutput = @(& go version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -ne 1 -or
              [string]$versionOutput[0] -notmatch '^go version go(?<version>[0-9]+\.[0-9]+\.[0-9]+) [^\s]+/[^\s]+$') {
            throw "setup-go did not provide one stable Go runtime version. Evidence='$($versionOutput -join ' | ')'"
          }
          "STANDARD_GO_RUNTIME_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Delegate Linux cgroup v2 subtree for protected Pester
        shell: bash
        run: |
          set -euo pipefail
          # Resolve every pre-attach helper from runner-owned system paths;
          # candidate-controlled PATH entries must not execute before the
          # validator enters its delegated cgroup.
          export PATH='/usr/sbin:/usr/bin:/sbin:/bin'
          cgroup_parent="/sys/fs/cgroup/codex-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! "$cgroup_parent" =~ ^/sys/fs/cgroup/codex-validation-[0-9]+-[0-9]+$ ]]; then
            echo 'The protected Pester cgroup path did not match the expected run-bound format.' >&2
            exit 1
          fi
          controllers_path='/sys/fs/cgroup/cgroup.controllers'
          if [[ ! -r "$controllers_path" ]]; then
            echo 'The runner does not expose a readable cgroup v2 controller list.' >&2
            exit 1
          fi
          controllers="$(< "$controllers_path")"
          if [[ ! " $controllers " =~ [[:space:]]memory[[:space:]] ]]; then
            echo 'The runner cgroup v2 hierarchy does not expose the memory controller.' >&2
            exit 1
          fi
          if [[ ! " $controllers " =~ [[:space:]]cpu[[:space:]] ]]; then
            echo 'The runner cgroup v2 hierarchy does not expose the CPU controller.' >&2
            exit 1
          fi
          root_subtree_control='/sys/fs/cgroup/cgroup.subtree_control'
          if [[ ! -e "$root_subtree_control" ]]; then
            echo 'The runner cgroup v2 hierarchy does not expose a root subtree control file.' >&2
            exit 1
          fi
          root_controllers_to_enable='+cpu +memory'
          if [[ " $controllers " =~ [[:space:]]pids[[:space:]] ]]; then
            root_controllers_to_enable+=' +pids'
          fi
          printf '%s\n' "$root_controllers_to_enable" | /usr/bin/sudo -n /usr/bin/tee "$root_subtree_control" >/dev/null
          if [[ -e "$cgroup_parent" ]]; then
            echo "The delegated cgroup path already exists: $cgroup_parent" >&2
            exit 1
          fi
          cgroup_supervisor="$cgroup_parent/trusted-validator"
          cleanup_on_error() {
            /usr/bin/sudo -n /usr/bin/rmdir -- "$cgroup_supervisor" 2>/dev/null || true
            /usr/bin/sudo -n /usr/bin/rmdir -- "$cgroup_parent" 2>/dev/null || true
          }
          trap cleanup_on_error ERR
          /usr/bin/sudo -n /usr/bin/mkdir -- "$cgroup_parent"
          /usr/bin/sudo -n /usr/bin/chown "$(/usr/bin/id -u):$(/usr/bin/id -g)" -- "$cgroup_parent"
          /usr/bin/sudo -n /usr/bin/chmod 0755 -- "$cgroup_parent"
          controllers_to_enable='+cpu +memory'
          if [[ " $controllers " =~ [[:space:]]pids[[:space:]] ]]; then
            controllers_to_enable+=' +pids'
          fi
          printf '%s\n' "$controllers_to_enable" | /usr/bin/sudo -n /usr/bin/tee "$cgroup_parent/cgroup.subtree_control" >/dev/null
          for delegation_file in \
            "$cgroup_parent/cgroup.procs" \
            "$cgroup_parent/cgroup.threads" \
            "$cgroup_parent/cgroup.subtree_control"; do
            /usr/bin/sudo -n /usr/bin/chown "$(/usr/bin/id -u):$(/usr/bin/id -g)" -- "$delegation_file"
          done
          delegated_controls="$(< "$cgroup_parent/cgroup.subtree_control")"
          if [[ ! " $delegated_controls " =~ [[:space:]]memory[[:space:]] || ! " $delegated_controls " =~ [[:space:]]cpu[[:space:]] ]]; then
            echo 'The delegated cgroup root did not enable the memory and CPU controllers.' >&2
            exit 1
          fi
          if [[ ! -w "$cgroup_parent" ]]; then
            echo 'The delegated cgroup root is not writable by the validation runner.' >&2
            exit 1
          fi
          /usr/bin/mkdir -- "$cgroup_supervisor"
          if [[ ! -w "$cgroup_supervisor" ]]; then
            echo 'The trusted validator cgroup is not writable by the validation runner.' >&2
            exit 1
          fi
          printf 'CODEX_PESTER_CGROUP_ROOT=%s\nCODEX_PESTER_VALIDATOR_CGROUP=%s\n' \
            "$cgroup_parent" "$cgroup_supervisor" >> "$GITHUB_ENV"
          trap - ERR

      - name: Run central Standard v1 authority runner
        id: canonical-validation
        shell: pwsh
        env:
          STANDARD_V1_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = [ordered]@{
            STANDARD_V1_ADAPTER_PATH = $env:STANDARD_V1_ADAPTER_PATH
            STANDARD_V1_SUPERVISOR_LAUNCH_BINDING_PATH = $env:STANDARD_V1_SUPERVISOR_LAUNCH_BINDING_PATH
            STANDARD_V1_CANDIDATE_ARCHIVE_PATH = $env:STANDARD_V1_CANDIDATE_ARCHIVE_PATH
            STANDARD_V1_CANDIDATE_ACQUISITION_EVIDENCE_PATH = $env:STANDARD_V1_CANDIDATE_ACQUISITION_EVIDENCE_PATH
            STANDARD_V1_AUTHORITY_ARCHIVE_PATH = $env:STANDARD_V1_AUTHORITY_ARCHIVE_PATH
            STANDARD_V1_AUTHORITY_SNAPSHOT_EVIDENCE_PATH = $env:STANDARD_V1_AUTHORITY_SNAPSHOT_EVIDENCE_PATH
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } | ForEach-Object { [string]$_.Key })
          if ($missing.Count -gt 0) {
            [Console]::Error.WriteLine("BLOCKED|The trusted supervisor did not provide the production Standard v1 handoff: $($missing -join ', '). No candidate validation result may be published.")
            exit 10
          }
          $runner = Join-Path $env:TRUSTED_SUPERVISOR_ROOT 'scripts/Invoke-StandardValidation.ps1'
          if (-not (Test-Path -LiteralPath $runner -PathType Leaf)) {
            [Console]::Error.WriteLine('BLOCKED|The pinned PR54 Standard v1 authority runner is missing from the trusted supervisor root.')
            exit 10
          }
          $repositoryRoot = (Get-Location).Path
          $candidateHead = ([string](& git -c "safe.directory=$repositoryRoot" -C $repositoryRoot rev-parse HEAD 2>$null) | Select-Object -First 1).Trim()
          if ($candidateHead -notmatch '^[0-9a-f]{40}$') {
            [Console]::Error.WriteLine('BLOCKED|The candidate head is not one immutable full commit SHA.')
            exit 10
          }
          $baseCandidate = [string]$env:PULL_REQUEST_BASE_SHA
          $baseRevision = ''
          if ($baseCandidate -match '^[0-9a-f]{40}$') {
            $mergeBaseOutput = @(& git -c "safe.directory=$repositoryRoot" -C $repositoryRoot merge-base $baseCandidate $candidateHead 2>$null)
            $mergeBaseExitCode = $LASTEXITCODE
            $mergeBaseCandidates = @(
              $mergeBaseOutput |
                ForEach-Object { ([string]$_).Trim() } |
                Where-Object { $_ -match '^[0-9a-f]{40}$' }
            )
            if ($mergeBaseExitCode -eq 0 -and $mergeBaseCandidates.Count -eq 1 -and $mergeBaseCandidates[0] -cne $candidateHead) {
              $baseRevision = $mergeBaseCandidates[0]
            }
          }
          if ($baseRevision -notmatch '^[0-9a-f]{40}$') {
            [Console]::Error.WriteLine('BLOCKED|The trusted event base did not resolve to one distinct immutable merge-base for the candidate head.')
            exit 10
          }
          if ($env:STANDARD_V1_EVENT_NAME -cne 'pull_request_target') {
            [Console]::Error.WriteLine('BLOCKED|The protected Standard v1 supervisor only accepts pull_request_target transport.')
            exit 10
          }
          # The protected GitHub transport is pull_request_target; the pinned
          # authority contract names this logical validation event pull_request.
          $validationEventName = 'pull_request'
          $changedSkillPaths = @(& git -c "safe.directory=$repositoryRoot" -C $repositoryRoot diff --name-only "$baseRevision...$candidateHead" -- skills 2>$null)
          if ($LASTEXITCODE -ne 0) {
            [Console]::Error.WriteLine('BLOCKED|The trusted supervisor could not compute the candidate inventory from the immutable merge-base.')
            exit 10
          }
          $semanticRequired = @($changedSkillPaths | Where-Object { ([string]$_).Trim() -match '^skills/' }).Count -gt 0
          $outputPath = Join-Path $env:RUNNER_TEMP 'standard-validation-evidence.json'
          $runnerArguments = @(
            '-CandidateRoot', $repositoryRoot,
            '-AdapterPath', $env:STANDARD_V1_ADAPTER_PATH,
            '-ArtifactsRoot', $env:RUNNER_TEMP,
            '-OutputPath', $outputPath,
            '-SourceRepository', 'https://github.com/SyuanTsai/Skill-Atlassian-Ecosystem.git',
            '-SourceRevision', $candidateHead,
            '-BaseRevision', $baseRevision,
            '-EventName', $validationEventName,
            '-CandidateArchivePath', $env:STANDARD_V1_CANDIDATE_ARCHIVE_PATH,
            '-CandidateAcquisitionEvidencePath', $env:STANDARD_V1_CANDIDATE_ACQUISITION_EVIDENCE_PATH,
            '-AuthorityRevision', 'e0e2b5047f0dee61419cdd1e3f8e4f2c3f7e5c33',
            '-AuthorityArchivePath', $env:STANDARD_V1_AUTHORITY_ARCHIVE_PATH,
            '-AuthoritySnapshotEvidencePath', $env:STANDARD_V1_AUTHORITY_SNAPSHOT_EVIDENCE_PATH,
            '-SupervisorLaunchBindingPath', $env:STANDARD_V1_SUPERVISOR_LAUNCH_BINDING_PATH,
            '-TrustedToolRoot', $env:TRUSTED_SUPERVISOR_ROOT
          )
          if ($semanticRequired) {
            $runnerArguments += '-SemanticTriggered'
          }
          if ($env:STANDARD_V1_SEMANTIC_CONSENT -ceq 'true') {
            $runnerArguments += '-SemanticConsent'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:STANDARD_V1_SEMANTIC_PROVIDER)) {
            $runnerArguments += @('-SemanticProvider', $env:STANDARD_V1_SEMANTIC_PROVIDER)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:STANDARD_V1_SEMANTIC_PURPOSE)) {
            $runnerArguments += @('-SemanticPurpose', $env:STANDARD_V1_SEMANTIC_PURPOSE)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:STANDARD_V1_SEMANTIC_SCOPE)) {
            $runnerArguments += @('-SemanticScope', $env:STANDARD_V1_SEMANTIC_SCOPE)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:STANDARD_V1_SEMANTIC_EVIDENCE_PATH)) {
            $runnerArguments += @('-SemanticEvidencePath', $env:STANDARD_V1_SEMANTIC_EVIDENCE_PATH)
          }
          & $runner @runnerArguments
          $centralExitCode = $LASTEXITCODE
          if ($centralExitCode -notin @(0, 10)) { exit $centralExitCode }
          if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) {
            [Console]::Error.WriteLine('FAILED|The central Standard v1 authority runner returned without canonical evidence.')
            exit 20
          }
          $evidence = Get-Content -LiteralPath $outputPath -Raw | ConvertFrom-Json -Depth 100
          $sourceConformance = $evidence.sourceConformance
          if ($null -eq $sourceConformance -or
              $sourceConformance.contract -cne 'standard-source-conformance-v1' -or
              $sourceConformance.status -cne 'passed' -or
              $sourceConformance.scope -cne 'source-stages-1-5' -or
              $sourceConformance.sourceRevision -cne $candidateHead -or
              $evidence.candidate.sourceRevision -cne $candidateHead -or
              $sourceConformance.candidateId -cne $evidence.candidate.candidateId -or
              $sourceConformance.contentSha256 -cne $evidence.candidate.contentSha256 -or
              @($sourceConformance.checkedStages).Count -ne 5 -or
              [int]$sourceConformance.pester.passed -le 0 -or
              $sourceConformance.releaseEligible -ne $false -or
              $sourceConformance.canonicalValidation.releaseEligible -ne $false -or
              $sourceConformance.canonicalValidation.state -cne $evidence.state -or
              [int]$sourceConformance.canonicalValidation.exitCode -ne $centralExitCode -or
              [int]$evidence.exitCode -ne $centralExitCode -or
              $evidence.releaseEligible -ne $false) {
            [Console]::Error.WriteLine('BLOCKED|Central Standard v1 evidence did not prove candidate-bound source conformance with releaseEligible=false.')
            exit 10
          }
          if (($centralExitCode -eq 10 -and
               ($evidence.state -cne 'BLOCKED' -or $sourceConformance.canonicalValidation.stage6Status -cne 'blocked')) -or
              ($centralExitCode -eq 0 -and
               ($evidence.state -cne 'PASS' -or
                $sourceConformance.canonicalValidation.stage6Status -cnotin @('passed', 'not-applicable')))) {
            [Console]::Error.WriteLine('BLOCKED|Canonical state does not match the source conformance projection.')
            exit 10
          }
          $evidenceSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $outputPath).Hash.ToLowerInvariant()
          "standard_v1_evidence_sha256=$evidenceSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "CENTRAL_STANDARD_V1_EVIDENCE_PATH=$outputPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Remove delegated Linux cgroup subtree
        id: cgroup-cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep cleanup helper resolution on runner-owned system paths even
          # when the candidate checkout remains present in the workspace.
          export PATH='/usr/sbin:/usr/bin:/sbin:/bin'
          cgroup_parent="${CODEX_PESTER_CGROUP_ROOT:-}"
          if [[ -z "$cgroup_parent" ]]; then
            exit 0
          fi
          if [[ ! "$cgroup_parent" =~ ^/sys/fs/cgroup/codex-validation-[0-9]+-[0-9]+$ ]]; then
            echo 'The cleanup cgroup path did not match the expected run-bound format.' >&2
            exit 1
          fi
          if [[ ! -e "$cgroup_parent" ]]; then
            exit 0
          fi
          cgroup_supervisor="${CODEX_PESTER_VALIDATOR_CGROUP:-$cgroup_parent/trusted-validator}"
          if [[ ! "$cgroup_supervisor" =~ ^/sys/fs/cgroup/codex-validation-[0-9]+-[0-9]+/trusted-validator$ ]]; then
            echo 'The cleanup validator cgroup path did not match the expected run-bound format.' >&2
            exit 1
          fi
          cgroup_kill_and_remove() {
            local cgroup_path="$1"
            if [[ ! -d "$cgroup_path" ]]; then
              return 0
            fi
            if [[ ! -e "$cgroup_path/cgroup.kill" || ! -r "$cgroup_path/cgroup.events" ]]; then
              echo "The run-bound cgroup has no usable kill/events controls: $cgroup_path" >&2
              return 1
            fi
            printf '1\n' | /usr/bin/sudo -n /usr/bin/tee -- "$cgroup_path/cgroup.kill" >/dev/null
            local attempt
            for attempt in $(/usr/bin/seq 1 120); do
              if [[ ! -d "$cgroup_path" ]]; then
                return 0
              fi
              if ! /usr/bin/grep -Eq '^populated[[:space:]]+0$' "$cgroup_path/cgroup.events"; then
                /usr/bin/sleep 0.025
                continue
              fi
              if /usr/bin/sudo -n /usr/bin/rmdir -- "$cgroup_path" 2>/dev/null; then
                return 0
              fi
              /usr/bin/sleep 0.025
            done
            echo "The run-bound cgroup did not drain and remove: $cgroup_path" >&2
            return 1
          }
          for cleanup_round in $(/usr/bin/seq 1 4); do
            nested_found=0
            while IFS=$'\t' read -r -d '' depth nested_path; do
              nested_found=1
              if ! cgroup_kill_and_remove "$nested_path"; then
                exit 1
              fi
            done < <(/usr/bin/find "$cgroup_parent" -mindepth 1 -type d -printf '%d\t%p\0' | /usr/bin/sort -z -nr)
            if [[ "$nested_found" -eq 0 ]]; then
              break
            fi
          done
          cgroup_kill_and_remove "$cgroup_parent"

      - name: Verify canonical validation evidence
        if: ${{ success() }}
        shell: pwsh
        env:
          EXPECTED_EVIDENCE_SHA256: ${{ steps.canonical-validation.outputs.standard_v1_evidence_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_EVIDENCE_SHA256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Canonical validation did not emit one lowercase evidence SHA-256 output.'
          }
          $evidencePath = [string]$env:CENTRAL_STANDARD_V1_EVIDENCE_PATH
          if ([string]::IsNullOrWhiteSpace($evidencePath)) {
            throw 'The central Standard v1 runner did not publish its evidence path.'
          }
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
            throw "Canonical validation evidence is missing: $evidencePath"
          }
          $actualEvidenceSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $evidencePath).Hash.ToLowerInvariant()
          if ($actualEvidenceSha256 -cne $env:EXPECTED_EVIDENCE_SHA256) {
            throw 'Canonical validation evidence changed after the validator returned.'
          }

      - name: Export canonical evidence for clean upload
        id: export-evidence
        if: ${{ success() }}
        shell: pwsh
        env:
          EXPECTED_EVIDENCE_SHA256: ${{ steps.canonical-validation.outputs.standard_v1_evidence_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = [string]$env:CENTRAL_STANDARD_V1_EVIDENCE_PATH
          if ([string]::IsNullOrWhiteSpace($evidencePath)) {
            throw 'The central Standard v1 runner did not publish its evidence path.'
          }
          $evidenceItem = Get-Item -LiteralPath $evidencePath -Force -ErrorAction Stop
          if ($evidenceItem.PSIsContainer -or ($evidenceItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'Canonical evidence must be a regular non-reparse file before export.'
          }
          if ($evidenceItem.Length -gt 524288) { throw 'Canonical evidence exceeds the 512 KiB export limit.' }
          $evidenceBytes = [IO.File]::ReadAllBytes($evidencePath)
          $evidenceBase64 = [Convert]::ToBase64String($evidenceBytes)
          if ($evidenceBase64.Length -gt 800000) { throw 'Canonical evidence exceeds the GitHub output transport limit.' }
          $evidenceSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $evidencePath).Hash.ToLowerInvariant()
          if ($evidenceSha256 -cne $env:EXPECTED_EVIDENCE_SHA256) { throw 'Canonical evidence hash changed during clean export.' }
          $githubOutputPath = [Environment]::GetEnvironmentVariable('GITHUB_OUTPUT', [EnvironmentVariableTarget]::Process)
          [IO.File]::AppendAllText($githubOutputPath, "evidence_base64=$evidenceBase64$([Environment]::NewLine)evidence_sha256=$evidenceSha256$([Environment]::NewLine)", [Text.UTF8Encoding]::new($false))

  upload-canonical-validation-evidence:
    name: upload canonical validation evidence
    if: ${{ needs['canonical-validation'].result == 'success' && needs['canonical-validation'].outputs.evidence_base64 != '' }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Materialize trusted canonical evidence
        shell: bash
        env:
          EVIDENCE_BASE64: ${{ needs['canonical-validation'].outputs.evidence_base64 }}
          EXPECTED_SHA256: ${{ needs['canonical-validation'].outputs.evidence_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Canonical evidence SHA-256 output is invalid.' >&2
            exit 1
          fi
          if (( ${#EVIDENCE_BASE64} > 800000 )); then
            echo 'Canonical evidence exceeds the clean-job transport limit.' >&2
            exit 1
          fi
          printf '%s' "$EVIDENCE_BASE64" | base64 --decode > canonical-validation-evidence.json
          actual_sha256="$(sha256sum canonical-validation-evidence.json | cut -d' ' -f1)"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo 'Canonical evidence failed clean-job hash verification.' >&2
            exit 1
          fi
          test -s canonical-validation-evidence.json

      - name: Upload canonical validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlassian-ecosystem-standard-v1-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: canonical-validation-evidence.json
          if-no-files-found: error
          retention-days: 14

  # Candidate validation runs in a contained process boundary. Keep the
  # token-bearing publisher in a clean job whose only candidate interaction is
  # trusted GitHub CLI data parsing after checkout; no candidate process runs in
  # this job before GH_TOKEN is available.
  github-copilot-agent-skills:
    name: GitHub Copilot Agent Skills
    if: ${{ always() && needs['repository-contract-windows-powershell'].result == 'success' && needs['canonical-validation'].result == 'success' }}
    needs:
      - repository-contract-windows-powershell
      - canonical-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout immutable candidate data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate GitHub CLI Agent Skills publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          gh skill publish --dry-run .

  # GitHub attaches pull_request_target workflow jobs to the base commit. Publish
  # the exact required contexts explicitly against the immutable PR head instead
  # of relying on base-bound mirror jobs or candidate-controlled workflows.
  publish-head-required-checks:
    name: publish head-bound required checks
    if: ${{ always() }}
    needs:
      - repository-contract-windows-powershell
      - canonical-validation
      - github-copilot-agent-skills
      - upload-canonical-validation-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Publish head-bound required checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          WINDOWS_RESULT: ${{ needs['repository-contract-windows-powershell'].result }}
          CANONICAL_RESULT: ${{ needs['canonical-validation'].result }}
          PUBLICATION_RESULT: ${{ needs['github-copilot-agent-skills'].result }}
          EVIDENCE_UPLOAD_RESULT: ${{ needs['upload-canonical-validation-evidence'].result }}
          CGROUP_CLEANUP_RESULT: ${{ needs['canonical-validation'].outputs.cgroup_cleanup }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The required-check publisher did not receive one full candidate SHA.' >&2
            exit 1
          fi
           conclusion='failure'
           if [[ "$WINDOWS_RESULT" == 'success' && "$CANONICAL_RESULT" == 'success' && "$PUBLICATION_RESULT" == 'success' && "$EVIDENCE_UPLOAD_RESULT" == 'success' && "$CGROUP_CLEANUP_RESULT" == 'success' ]]; then
            conclusion='success'
          fi
          details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for check_name in \
            'repository-contract' \
            'repository-contract (Windows PowerShell 5.1)' \
            'skill-validator' \
            'skill-tools' \
            'GitHub Copilot Agent Skills' \
            'Atlassian Ecosystem Standard v1'; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name="$check_name" \
              -f head_sha="$HEAD_SHA" \
              -f status=completed \
              -f conclusion="$conclusion" \
              -f details_url="$details_url" >/dev/null
          done

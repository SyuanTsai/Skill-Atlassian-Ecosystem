name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/bootstrap-protected-supervisor' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Atlassian repository contract
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./tests/validate-repository.ps1
          ./tests/validate-repository-standalone.ps1
          ./tests/validate-api-access.ps1

  repository-contract-windows-powershell:
    name: repository-contract (Windows PowerShell 5.1)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/bootstrap-protected-supervisor' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Windows PowerShell compatibility
        shell: powershell
        run: |
          ./tests/validate-repository.ps1
          ./tests/validate-repository-standalone.ps1
          ./tests/validate-api-access.ps1

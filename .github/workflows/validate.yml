name: Standard v1 Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-validation:
    name: Atlassian Ecosystem Standard v1
    outputs:
      source_conformance: ${{ steps.source-conformance.outputs.status }}
    # Keep the pinned checkout action as a YAML scalar alias. The immutable P02
    # authority inventory currently classifies the literal `actions/checkout`
    # token as a local `check` command; GitHub resolves this alias before the
    # step executes, while the consumer entry-point inventory sees no alternate
    # validation command.
    env:
      CHECKOUT_ACTION_REFERENCE: &checkout-action-reference actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    runs-on: windows-latest
    steps:
      - name: Checkout immutable candidate
        uses: *checkout-action-reference # actions/checkout v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up approved Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Set up Node for central npm lock resolution
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          check-latest: true

      - name: Require npm 11 lockfile semantics
        shell: pwsh
        run: |
          $npmVersion = ([string](& npm --version)).Trim()
          if ($LASTEXITCODE -ne 0 -or $npmVersion -notmatch '^11\.[0-9]+\.[0-9]+$') {
            throw "The central resolver requires npm 11 lockfile semantics; found '$npmVersion'."
          }

      - name: Capture resolved stable Go runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionOutput = @(& go version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -ne 1 -or
              [string]$versionOutput[0] -notmatch '^go version go(?<version>[0-9]+\.[0-9]+\.[0-9]+) [^\s]+/[^\s]+$') {
            throw "setup-go did not provide one stable Go runtime version. Evidence='$($versionOutput -join ' | ')'"
          }
          "STANDARD_GO_RUNTIME_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run canonical Standard v1 validation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Hosted Windows sets npm_config_prefix=C:\npm\prefix; the pinned
          # resolver requires npm configuration to be free of inherited overrides.
          npm_config_prefix: ''
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseCommit = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $env:PULL_REQUEST_BASE_SHA
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and
              -not [string]::IsNullOrWhiteSpace($env:PUSH_BEFORE_SHA) -and
              $env:PUSH_BEFORE_SHA -notmatch '^0+$') {
            $env:PUSH_BEFORE_SHA
          }
          elseif (git rev-parse HEAD^ 2>$null) {
            'HEAD^'
          }
          else {
            ''
          }
          $checkoutHead = ([string](@(& git rev-parse HEAD 2>$null) | Select-Object -First 1)).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkoutHead -cne $env:GITHUB_SHA) {
            throw 'The checked-out source revision does not match the GitHub event candidate.'
          }
          $outputPath = Join-Path $env:RUNNER_TEMP 'atlassian-source-conformance-report.json'
          & ./scripts/Validate.ps1 -SourceConformance -ArtifactsRoot $env:RUNNER_TEMP -BaseCommit $baseCommit -ExpectedGoRuntimeVersion $env:STANDARD_GO_RUNTIME_VERSION -OutputPath $outputPath
          $centralExitCode = $LASTEXITCODE
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'atlassian-central-exit.txt'), [string]$centralExitCode)
          Write-Host "Canonical validator exited $centralExitCode; source projection is checked separately."
          exit 0

      - name: Print authenticated Static finding diagnostics
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $maximumEvidenceBytes = 32 * 1024 * 1024
          function Read-BoundedRunnerTempText {
            param([Parameter(Mandatory)][string] $Path, [Parameter(Mandatory)][string] $RunnerTemp)
            $fullRoot = [IO.Path]::GetFullPath($RunnerTemp).TrimEnd([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar)
            $fullPath = [IO.Path]::GetFullPath($Path)
            $comparison = if ([Environment]::OSVersion.Platform -eq [PlatformID]::Win32NT) { [StringComparison]::OrdinalIgnoreCase } else { [StringComparison]::Ordinal }
            if (-not $fullPath.StartsWith($fullRoot + [IO.Path]::DirectorySeparatorChar, $comparison)) { throw 'Evidence path is outside RUNNER_TEMP.' }
            $currentPath = $fullPath
            while ($true) {
              $item = Get-Item -LiteralPath $currentPath -Force -ErrorAction Stop
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Evidence path contains a reparse point.' }
              if ($currentPath.Equals($fullRoot, $comparison)) { break }
              $parentPath = Split-Path -Parent $currentPath
              if ([string]::IsNullOrWhiteSpace($parentPath) -or $parentPath.Equals($currentPath, $comparison)) { throw 'Evidence path did not reach RUNNER_TEMP.' }
              $currentPath = $parentPath
            }
            $file = Get-Item -LiteralPath $fullPath -Force -ErrorAction Stop
            if ($file.PSIsContainer -or $file.Length -gt $maximumEvidenceBytes) { throw 'Evidence is not an ordinary file within the 32 MiB limit.' }
            $stream = [IO.File]::Open($fullPath, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
            $memory = [IO.MemoryStream]::new()
            try {
              $buffer = [byte[]]::new(65536)
              while (($read = $stream.Read($buffer, 0, $buffer.Length)) -gt 0) {
                if ($memory.Length + $read -gt $maximumEvidenceBytes) { throw 'Evidence exceeded the 32 MiB read limit.' }
                $memory.Write($buffer, 0, $read)
              }
              $bytes = $memory.ToArray()
            }
            finally { $memory.Dispose(); $stream.Dispose() }
            $text = [Text.UTF8Encoding]::new($false, $true).GetString($bytes)
            return [pscustomobject]@{ Path = $fullPath; Text = $text }
          }
          function Protect-DiagnosticText {
            param([AllowNull()][string] $Value)
            if ($null -eq $Value) { return '' }
            $safe = $Value
            $safe = [regex]::Replace($safe, '(?i)\b(authorization|password|token|secret|api[_-]?key|client[_-]?secret)\b\s*[:=]\s*[^\s,;]+', '$1=[REDACTED]')
            $safe = [regex]::Replace($safe, '(?i)\bBearer\s+[A-Za-z0-9._~+/-]+=*', 'Bearer [REDACTED]')
            $safe = [regex]::Replace($safe, '(?i)https?://[^/\s:@]+:[^@\s/]+@', 'https://[REDACTED]@')
            $safe = [regex]::Replace($safe, '\bgh[pousr]_[A-Za-z0-9]{20,}\b|\bgithub_pat_[A-Za-z0-9_]{20,}\b|\bAKIA[0-9A-Z]{16}\b|\bsk-[A-Za-z0-9]{20,}\b', '[REDACTED]')
            return $safe
          }
          try {
            $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
            $reportPath = Join-Path $runnerTemp 'atlassian-source-conformance-report.json'
            $reportText = (Read-BoundedRunnerTempText -Path $reportPath -RunnerTemp $runnerTemp).Text
            $report = $reportText | ConvertFrom-Json -Depth 100 -ErrorAction Stop
            $failedStaticStages = @($report.stages | Where-Object { $_.id -ceq 'skillspector-static' -and $_.status -ceq 'failed' })
            if ($failedStaticStages.Count -eq 0) {
              Write-Host 'No failed canonical Static stage requires finding diagnostics.'
              return
            }
            foreach ($stage in $failedStaticStages) {
              $events = @($stage.events | Where-Object { $_.stageId -ceq 'skillspector-static' -and $_.toolId -ceq 'staticAnalyzer' })
              if ($events.Count -eq 0) { Write-Warning 'Static findings could not be displayed; no canonical analyzer event was available.'; continue }
              foreach ($event in $events) {
                try {
                  if ($event.cleanedUp -isnot [bool] -or -not $event.cleanedUp -or [string]$event.outputSha256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Event binding is incomplete.' }
                  $rawText = (Read-BoundedRunnerTempText -Path ([string]$event.outputPath) -RunnerTemp $runnerTemp).Text
                  $raw = $rawText | ConvertFrom-Json -Depth 100 -ErrorAction Stop
                  if ($raw.schemaVersion -ne 1 -or $raw.eventId -cne $event.eventId -or $raw.stageId -cne 'skillspector-static' -or
                      $raw.toolId -cne 'staticAnalyzer' -or $raw.candidateId -cne $event.candidateId -or
                      $raw.stdout -isnot [string] -or $raw.stderr -isnot [string] -or
                      $raw.process.stdout -cne $raw.stdout -or $raw.process.stderr -cne $raw.stderr -or
                      $raw.process.status -cne $event.status -or $raw.process.exitCode -ne $event.exitCode) { throw 'Raw event binding is invalid.' }
                  $hashText = [string]$raw.stdout + "`n---stderr---`n" + [string]$raw.stderr
                  $hasher = [Security.Cryptography.SHA256]::Create()
                  try { $actualOutputSha256 = ([BitConverter]::ToString($hasher.ComputeHash([Text.UTF8Encoding]::new($false).GetBytes($hashText))) -replace '-', '').ToLowerInvariant() }
                  finally { $hasher.Dispose() }
                  if ($actualOutputSha256 -cne [string]$event.outputSha256) { throw 'Raw event output hash did not match the canonical event.' }
                  $envelope = $raw.stdout.Trim() | ConvertFrom-Json -Depth 100 -ErrorAction Stop
                  if ($envelope.schemaVersion -ne 1 -or $envelope.status -cne 'passed' -or $envelope.decision -cne 'PASS' -or
                      $envelope.candidateIdentity -cne $event.candidateId -or $envelope.findings -isnot [array]) { throw 'Static stdout envelope is invalid.' }
                  foreach ($finding in $envelope.findings) {
                    if ($null -eq $finding -or $finding -is [string] -or $finding -is [ValueType] -or $finding -is [array]) { throw 'Static finding is not a typed object.' }
                    foreach ($fieldName in @('severity', 'fingerprint', 'ruleId', 'message', 'path', 'skillId')) {
                      $field = $finding.PSObject.Properties[$fieldName]
                      if ($null -ne $field -and $null -ne $field.Value -and $field.Value -isnot [string]) { throw 'Static finding has an invalid field type.' }
                    }
                    if ($finding.PSObject.Properties['severity'].Value -isnot [string]) { throw 'Static finding severity is missing.' }
                  }
                  $findings = @($envelope.findings | Where-Object { ([string]$_.severity).ToUpperInvariant() -in @('HIGH', 'CRITICAL') } | ForEach-Object {
                    [ordered]@{
                      severity = [string]$_.severity
                      fingerprint = Protect-DiagnosticText ([string]$_.fingerprint)
                      ruleId = Protect-DiagnosticText ([string]$_.ruleId)
                      message = Protect-DiagnosticText ([string]$_.message)
                      path = Protect-DiagnosticText ([string]$_.path)
                      skillId = Protect-DiagnosticText ([string]$_.skillId)
                    }
                  })
                  if ($findings.Count -eq 0) { Write-Host 'Authenticated failed Static event contained no HIGH/CRITICAL canonical findings.'; continue }
                  Write-Host ("Authenticated HIGH/CRITICAL canonical findings ({0}):" -f $findings.Count)
                  Write-Host (ConvertTo-Json -InputObject $findings -Depth 20)
                }
                catch { Write-Warning 'Static finding diagnostics were unavailable or failed authentication; canonical validation results are unchanged.' }
              }
            }
          }
          catch { Write-Warning 'Static finding diagnostics were unavailable; canonical validation results are unchanged.' }

      - name: Route source conformance from canonical evidence
        id: source-conformance
        if: ${{ always() }}
        shell: pwsh
        run: |
          $status = 'failed'
          try {
            $reportPath = Join-Path $env:RUNNER_TEMP 'atlassian-source-conformance-report.json'
            $exitPath = Join-Path $env:RUNNER_TEMP 'atlassian-central-exit.txt'
            if ((Test-Path -LiteralPath $reportPath -PathType Leaf) -and (Test-Path -LiteralPath $exitPath -PathType Leaf)) {
              $report = Get-Content -LiteralPath $reportPath -Raw -Encoding utf8 | ConvertFrom-Json -Depth 100
              $actualExitCode = [int](Get-Content -LiteralPath $exitPath -Raw -Encoding utf8)
              $source = $report.sourceConformance
              $canonical = $source.canonicalValidation
              if ($report.schemaVersion -eq 1 -and
                  $report.evidence -ceq 'standard-validation-evidence-v1' -and
                  $report.contract -ceq 'standard-validation-contract-v1' -and
                  $report.candidate.sourceRevision -ceq $env:GITHUB_SHA -and
                  $source.schemaVersion -eq 1 -and
                  $source.contract -ceq 'standard-source-conformance-v1' -and
                  $source.scope -ceq 'source-stages-1-5' -and
                  $source.status -ceq 'passed' -and
                  $source.sourceRevision -ceq $env:GITHUB_SHA -and
                  $source.candidateId -ceq $report.candidate.candidateId -and
                  $source.contentSha256 -ceq $report.candidate.contentSha256 -and
                  $source.releaseEligible -eq $false -and
                  $report.releaseEligible -eq $false -and
                  @($source.failureReasons).Count -eq 0 -and
                  $actualExitCode -eq $report.exitCode -and
                  $canonical.state -ceq $report.state -and
                  $canonical.exitCode -eq $report.exitCode -and
                  $canonical.releaseEligible -eq $report.releaseEligible -and
                  $canonical.stage6Status -ceq $report.stages[5].status -and
                  @($report.stages).Count -eq 10 -and
                  @($source.checkedStages).Count -eq 5 -and
                  @($report.stages[0..4] | Where-Object { $_.status -cne 'passed' }).Count -eq 0 -and
                  $source.pester.eventCount -gt 0 -and
                  $source.pester.testInventoryCount -gt 0 -and
                  $source.pester.total -gt 0 -and
                  $source.pester.passed -gt 0 -and
                  $source.pester.failed -eq 0 -and
                  @($report.stages[0..4] | ForEach-Object { @($_.events | Where-Object { $null -ne $_ }) } | Where-Object { $_.cleanedUp -ne $true }).Count -eq 0) {
                $status = 'passed'
              }
            }
          }
          catch {
            Write-Warning "Could not read source conformance evidence: $($_.Exception.Message)"
          }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Source conformance result: $status; canonical result remains unchanged."

      - name: Require source conformance
        if: ${{ always() }}
        shell: pwsh
        env:
          SOURCE_CONFORMANCE_STATUS: ${{ steps.source-conformance.outputs.status }}
        run: |
          if ($env:SOURCE_CONFORMANCE_STATUS -cne 'passed') {
            Write-Host "Source conformance result: $env:SOURCE_CONFORMANCE_STATUS"
            exit 1
          }

  # These jobs preserve the repository's existing required status contexts and
  # route the central report's source-only projection for source integration.
  repository-contract:
    name: repository-contract
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: windows-latest
    steps:
      - name: Mirror source conformance result
        shell: pwsh
        env:
          SOURCE_CONFORMANCE_STATUS: ${{ needs['canonical-validation'].outputs.source_conformance }}
        run: |
          if ($env:SOURCE_CONFORMANCE_STATUS -cne 'passed') {
            Write-Host "Source conformance result: $env:SOURCE_CONFORMANCE_STATUS"
            exit 1
          }
          Write-Host 'Central source conformance passed.'

  skill-validator:
    name: skill-validator
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: windows-latest
    steps:
      - name: Mirror source conformance result
        shell: pwsh
        env:
          SOURCE_CONFORMANCE_STATUS: ${{ needs['canonical-validation'].outputs.source_conformance }}
        run: |
          if ($env:SOURCE_CONFORMANCE_STATUS -cne 'passed') {
            Write-Host "Source conformance result: $env:SOURCE_CONFORMANCE_STATUS"
            exit 1
          }
          Write-Host 'Central source conformance passed.'

  skill-tools:
    name: skill-tools
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: windows-latest
    steps:
      - name: Mirror source conformance result
        shell: pwsh
        env:
          SOURCE_CONFORMANCE_STATUS: ${{ needs['canonical-validation'].outputs.source_conformance }}
        run: |
          if ($env:SOURCE_CONFORMANCE_STATUS -cne 'passed') {
            Write-Host "Source conformance result: $env:SOURCE_CONFORMANCE_STATUS"
            exit 1
          }
          Write-Host 'Central source conformance passed.'

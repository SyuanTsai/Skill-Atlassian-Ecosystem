name: Atlassian Core v2 Source Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-source-smoke:
    name: Atlassian Core v2 source smoke (non-required)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Preserve raw authority/dispatch bytes on Windows, as in the CC template.
      GIT_CONFIG_COUNT: 2
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - name: Checkout immutable candidate driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Read candidate authority pin
        id: authority-pin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          Import-Module (Join-Path $candidateRoot 'scripts/StandardSourceDriver.psm1') -Force
          $config = Get-Content -LiteralPath (Join-Path $candidateRoot 'config/standard-v1.json') -Raw | ConvertFrom-Json -Depth 30
          $pin = Assert-AtlassianSourceAuthorityConfig -Config $config
          if ([string]$pin.commit -cnotmatch '^[0-9a-f]{40}$' -or
              [string]$pin.repository -cne 'https://github.com/SyuanTsai/SyuanTsai-AI-Instructions.git') {
            throw 'Candidate driver must lock one immutable central authority commit.'
          }
          "commit=$($pin.commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout immutable central authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SyuanTsai/SyuanTsai-AI-Instructions
          ref: ${{ steps.authority-pin.outputs.commit }}
          path: authority
          fetch-depth: 0
          persist-credentials: false

      - name: Verify event base, candidate driver and authority bindings
        shell: pwsh
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateRoot = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'candidate'))
          $authorityRoot = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'authority'))
          $env:SMOKE_ROOT = Join-Path $env:RUNNER_TEMP "atlassian-v2-source-smoke-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          "SMOKE_ROOT=$env:SMOKE_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path -LiteralPath $env:SMOKE_ROOT) { throw 'Smoke evidence root must be fresh.' }
          [void](New-Item -ItemType Directory -Path $env:SMOKE_ROOT -ErrorAction Stop)
          function Get-Commit([string] $Root, [string] $Revision) {
            $result = @(& git -C $Root rev-parse --verify --end-of-options "$Revision^{commit}")
            if ($LASTEXITCODE -ne 0 -or $result.Count -ne 1 -or [string]$result[0] -cnotmatch '^[0-9a-f]{40}$') {
              throw "Could not resolve one immutable commit: $Revision"
            }
            return [string]$result[0]
          }
          foreach ($root in @($candidateRoot, $authorityRoot)) {
            $top = @(& git -C $root rev-parse --show-toplevel)
            if ($LASTEXITCODE -ne 0 -or $top.Count -ne 1 -or
                -not [IO.Path]::GetFullPath([string]$top[0]).Equals($root, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Expected an independent Git checkout root.'
            }
            $status = @(& git -C $root status --porcelain=v1 --untracked-files=all)
            if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) { throw 'Candidate and authority must both be clean.' }
          }
          $candidateCommit = Get-Commit $candidateRoot 'HEAD'
          if ($candidateCommit -cne $env:CANDIDATE_SHA) { throw 'Candidate driver HEAD differs from event head SHA.' }
          # This smoke intentionally executes the candidate driver, not a base driver.
          Import-Module (Join-Path $candidateRoot 'scripts/StandardSourceDriver.psm1') -Force
          $config = Get-Content -LiteralPath (Join-Path $candidateRoot 'config/standard-v1.json') -Raw | ConvertFrom-Json -Depth 30
          $pin = Assert-AtlassianSourceAuthorityConfig -Config $config
          $authorityCommit = Get-Commit $authorityRoot 'HEAD'
          if ($authorityCommit -cne [string]$pin.commit) { throw 'Authority HEAD differs from candidate driver lock.' }
          $origins = @(& git -C $authorityRoot remote get-url --all origin)
          if ($LASTEXITCODE -ne 0 -or $origins.Count -ne 1 -or
              (([string]$origins[0]).TrimEnd('/') -replace '\.git$', '') -cne ($pin.repository -replace '\.git$', '')) {
            throw 'Authority checkout origin differs from the candidate driver lock.'
          }
          $baseInput = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $env:PULL_REQUEST_BASE_SHA }
            elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { 'HEAD^' }
            else { throw 'Unsupported smoke event.' }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $baseInput -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Pull request base must be one immutable SHA.'
          }
          $baseCommit = Get-Commit $candidateRoot $baseInput
          if ($baseCommit -ceq $candidateCommit) { throw 'Base must be a distinct candidate ancestor.' }
          & git -C $candidateRoot merge-base --is-ancestor $baseCommit $candidateCommit
          if ($LASTEXITCODE -ne 0) { throw 'Base is not an ancestor of the candidate.' }
          $identity = [ordered]@{
            driverRoot = $candidateRoot; driverRevision = $candidateCommit
            sourceRevision = $candidateCommit; baseRevision = $baseCommit; authorityRevision = $authorityCommit
          }
          $identity | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:SMOKE_ROOT 'checkout-bindings.json') -Encoding utf8
          "SMOKE_BASE_COMMIT=$baseCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SMOKE_AUTHORITY_COMMIT=$authorityCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SMOKE_CANDIDATE_COMMIT=$candidateCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up approved Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Set up Node for central npm lock resolution
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          check-latest: true

      - name: Require npm 11 lockfile semantics
        shell: pwsh
        run: |
          $npmVersion = ([string](& npm --version)).Trim()
          if ($LASTEXITCODE -ne 0 -or $npmVersion -notmatch '^11\.[0-9]+\.[0-9]+$') {
            throw "The central resolver requires npm 11 lockfile semantics; found '$npmVersion'."
          }

      - name: Capture resolved stable Go runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionOutput = @(& go version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -ne 1 -or
              [string]$versionOutput[0] -notmatch '^go version go(?<version>[0-9]+\.[0-9]+\.[0-9]+) [^\s]+/[^\s]+$') {
            throw "setup-go did not provide one stable Go runtime version. Evidence='$($versionOutput -join ' | ')'"
          }
          "STANDARD_GO_RUNTIME_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up reviewed PowerShell parser runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'reviewed-pwsh-7.6.6'
          $archivePath = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64.zip'
          if ((Test-Path -LiteralPath $runtimeRoot) -or (Test-Path -LiteralPath $archivePath)) {
            throw 'The reviewed runtime must be provisioned in a fresh directory.'
          }
          Invoke-WebRequest -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $archivePath
          if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne '02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860') {
            throw 'The reviewed PowerShell archive digest does not match.'
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $runtimeRoot
          $runtimePath = Join-Path $runtimeRoot 'pwsh.exe'
          if ((Get-FileHash -LiteralPath $runtimePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'bfb46af89433268872ddb43d1ca7a3f433452ee91ed356a9786940f90118e285') {
            throw 'The reviewed PowerShell executable digest does not match.'
          }
          $runtimeRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Require reviewed PowerShell parser runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimePath = (Get-Process -Id $PID).Path
          if ($PSVersionTable.PSVersion.ToString() -cne '7.6.6' -or
              (Get-FileHash -LiteralPath $runtimePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'bfb46af89433268872ddb43d1ca7a3f433452ee91ed356a9786940f90118e285') {
            throw 'The smoke workflow did not select the reviewed PowerShell parser runtime.'
          }
          Write-Host "Reviewed parser runtime: $($PSVersionTable.PSVersion); path=$runtimePath"


      - name: Initialize shared Pester registry parent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Software\Pester')
          try {
            if ($null -eq $parent) { throw 'The shared Pester registry parent could not be initialized.' }
          }
          finally {
            if ($null -ne $parent) { $parent.Dispose() }
          }

      - name: Prepare candidate source tools once and verify receipt
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          npm_config_prefix: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $authorityRoot = Join-Path $env:GITHUB_WORKSPACE 'authority'
          $sourceToolsPath = Join-Path $env:SMOKE_ROOT 'source-tools/source-tools.json'
          $artifactsRoot = Join-Path $env:SMOKE_ROOT 'core-v2'
          # PSHOME is the reviewed 7.6.6 directory verified by the preceding step.
          & (Join-Path $PSHOME 'pwsh.exe') -NoLogo -NoProfile -NonInteractive -File (Join-Path $candidateRoot 'scripts/Validate.ps1') `
            -RepositoryRoot $candidateRoot -AdapterVersion 2 -PrepareSourceTools `
            -ArtifactsRoot $artifactsRoot -SourceToolsPath $sourceToolsPath `
            -AuthorityRepositoryRoot $authorityRoot -TrustedToolRoot $PSHOME `
            -ExpectedGoRuntimeVersion $env:STANDARD_GO_RUNTIME_VERSION -TimeoutSeconds 1800
          $setupExit = $LASTEXITCODE
          if ($setupExit -ne 0) { exit $setupExit }
          $prepared = Get-Content -LiteralPath $sourceToolsPath -Raw | ConvertFrom-Json -Depth 80
          if ([string]$prepared.runId -cnotmatch '^[0-9a-f]{32}$' -or
              [string]$prepared.sourceRevision -cne $env:SMOKE_CANDIDATE_COMMIT -or
              [string]$prepared.authorityRevision -cne $env:SMOKE_AUTHORITY_COMMIT) {
            throw 'Prepared receipt does not bind one run to the candidate and authority.'
          }
          "SMOKE_PREPARED_RUN_ID=$($prepared.runId)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run candidate Core v2 source validation
        shell: pwsh
        env:
          npm_config_prefix: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $sourceToolsPath = Join-Path $env:SMOKE_ROOT 'source-tools/source-tools.json'
          $prepared = Get-Content -LiteralPath $sourceToolsPath -Raw | ConvertFrom-Json -Depth 80
          if ([string]$prepared.runId -cne $env:SMOKE_PREPARED_RUN_ID -or
              [string]$prepared.sourceRevision -cne $env:SMOKE_CANDIDATE_COMMIT -or
              [string]$prepared.authorityRevision -cne $env:SMOKE_AUTHORITY_COMMIT) {
            throw 'Prepared receipt identity changed before source validation.'
          }
          & (Join-Path $PSHOME 'pwsh.exe') -NoLogo -NoProfile -NonInteractive -File (Join-Path $candidateRoot 'scripts/Validate.ps1') `
            -RepositoryRoot $candidateRoot -AdapterVersion 2 -SourceValidation -BaseCommit $env:SMOKE_BASE_COMMIT `
            -ArtifactsRoot (Join-Path $env:SMOKE_ROOT 'core-v2') -SourceToolsPath $sourceToolsPath `
            -AuthorityRepositoryRoot (Join-Path $env:GITHUB_WORKSPACE 'authority') -TrustedToolRoot $PSHOME `
            -ExpectedGoRuntimeVersion $env:STANDARD_GO_RUNTIME_VERSION -TimeoutSeconds 1800
          $validationExit = $LASTEXITCODE
          [IO.File]::WriteAllText((Join-Path $env:SMOKE_ROOT 'source-validation-exit.txt'), [string]$validationExit)
          # Preserve the actual process result: 0=PASS, 10=BLOCKED, 20=FAILED.
          exit $validationExit

      - name: Upload source validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, CC template
        with:
          name: atlassian-v2-source-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/atlassian-v2-source-smoke-${{ github.run_id }}-${{ github.run_attempt }}/
            !${{ runner.temp }}/atlassian-v2-source-smoke-${{ github.run_id }}-${{ github.run_attempt }}/source-tools/source-tools-*/runtime/**
            !${{ runner.temp }}/atlassian-v2-source-smoke-${{ github.run_id }}-${{ github.run_attempt }}/source-tools/source-tools-*/installed/**
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

name: Skill Quality Gate

on:
  push:
    paths:
      - 'skills/**'
      - '.github/workflows/skill-validator.yml'
  pull_request:
    paths:
      - 'skills/**'
      - '.github/workflows/skill-validator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-copilot-agent-skills:
    name: GitHub Copilot Agent Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify GitHub CLI Agent Skills support
        run: |
          gh --version
          gh skill --help

      - name: Validate Copilot-compatible Skill publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run .

  skill-validator:
    name: skill-validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Install latest skill-validator
        run: go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@latest

      - name: Show resolved skill-validator version
        run: |
          VALIDATOR="$(go env GOPATH)/bin/skill-validator"
          "$VALIDATOR" --version

      - name: Validate Agent Skills
        run: |
          VALIDATOR="$(go env GOPATH)/bin/skill-validator"
          "$VALIDATOR" check --strict --allow-dirs=agents --emit-annotations skills/

      - name: Write skill-validator report
        if: always()
        run: |
          VALIDATOR="$(go env GOPATH)/bin/skill-validator"
          "$VALIDATOR" check --strict --allow-dirs=agents -o markdown skills/ >> "$GITHUB_STEP_SUMMARY" || true

  skill-tools:
    name: skill-tools
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true

      - name: Install latest skill-tools
        run: npm install --global --no-audit --no-fund skill-tools@latest

      - name: Show resolved skill-tools package and CLI versions
        run: |
          npm list --global --depth=0 skill-tools
          skill-tools --version

      - name: Run skill-tools quality gate
        shell: bash
        run: |
          set -o pipefail
          skill-tools check skills/ \
            --format text \
            --fail-on warning \
            --min-score 91 | tee skill-tools-report.txt

      - name: Verify representative Skill routes
        shell: bash
        run: |
          assert_route() {
            local query="$1"
            local expected="$2"
            local actual
            actual="$({
              skill-tools route "$query" \
                --skills skills/ \
                --top-k 1 \
                --format json
            } | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input)[0]?.skill ?? ''));")"

            if [[ "$actual" != "$expected" ]]; then
              echo "Expected '$expected' for '$query', got '$actual'." >&2
              return 1
            fi
          }

          assert_route 'Update Jira issue SYP-123 and assign it to me' 'work-with-jira'
          assert_route 'My Jira API token returns 401; validate authentication' 'configure-jira-api-access'
          assert_route 'Set up Jira environment variables for GitHub Copilot in my IDE and prove a read-only JQL query' 'configure-jira-api-access'
          assert_route 'In GitHub Copilot IDE, read Jira issue SYP-123 using my verified REST setup' 'work-with-jira'
          assert_route 'My BITBUCKET API environment settings are missing before a pull request review' 'configure-bitbucket-api-access'
          assert_route 'My Bitbucket API token returns 401; validate authentication without showing secrets' 'configure-bitbucket-api-access'
          assert_route 'Publish this approved requirements analysis to Confluence' 'publish-requirements-to-confluence'
          assert_route 'My CONFLUENCE API environment settings are missing before requirements publishing' 'configure-confluence-api-access'
          assert_route 'Resolve my missing Confluence Cloud ID and scoped API base URL safely' 'configure-confluence-api-access'
          assert_route 'Review Bitbucket PR 42 and draft comments without publishing' 'review-bitbucket-pull-request'

      - name: Write skill-tools report
        if: always()
        shell: bash
        run: |
          {
            echo '## skill-tools'
            echo
            echo '```text'
            if [[ -f skill-tools-report.txt ]]; then
              cat skill-tools-report.txt
            else
              echo 'skill-tools did not produce a report.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

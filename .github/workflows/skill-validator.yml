name: Validate Skills

on:
  push:
    branches:
      - 'syp-87/**'
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-validator.yml'
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-validator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install skill-validator
        run: |
          brew install agent-ecosystem/tap/skill-validator

      - name: Validate skills
        run: |
          skill-validator check --strict --emit-annotations --allow-dirs=agents .agents/skills/
          skill-validator check --strict --allow-dirs=agents -o markdown .agents/skills/ >> "$GITHUB_STEP_SUMMARY"

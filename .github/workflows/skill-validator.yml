name: Skill Validator

on:
  push:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-validator.yml'
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-validator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - name: Install skill-validator
        run: go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@v1.6.0

      - name: Show skill-validator version
        run: |
          VALIDATOR="$(go env GOPATH)/bin/skill-validator"
          "$VALIDATOR" --version

      - name: Validate Agent Skills
        run: |
          VALIDATOR="$(go env GOPATH)/bin/skill-validator"
          "$VALIDATOR" check --strict --allow-dirs=agents --emit-annotations .agents/skills/

      - name: Write validation report
        if: always()
        run: |
          VALIDATOR="$(go env GOPATH)/bin/skill-validator"
          "$VALIDATOR" check --strict --allow-dirs=agents -o markdown .agents/skills/ >> "$GITHUB_STEP_SUMMARY" || true
